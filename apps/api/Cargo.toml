[package]
name = "ruchoir-api"
version = "0.0.0"
description = "Ruchoir backend: HTTP/real-time API and static web host."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ruchoir-api"
path = "src/main.rs"

[features]
default = []
# Opt-in dev TLS (self-signed certs). Off by default so the standard build and CI
# stay provider-free. See scripts/dev-tls.sh and docs for usage.
tls = ["dep:axum-server", "dep:rustls"]

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
utoipa = { workspace = true }
axum-server = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

# Data layer: PostgreSQL via SeaORM, Valkey via fred, migrations from the workspace crate.
sea-orm = { workspace = true }
fred = { workspace = true }
ruchoir-migration = { path = "../../migrations" }
