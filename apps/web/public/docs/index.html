<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruchoir API reference</title>
    <style>
      /* Provisional Ruchoir wordmark bar. The brand is not finalized (the design system
         ships a placeholder logotype); full brand integration lands later. */
      .wc-topbar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid #e8ded2;
        background: #f7f3ed;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .wc-mark {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #171716;
      }
      .wc-dot {
        color: #c65d45;
      }
      .wc-sub {
        font-size: 12px;
        color: #807a74;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      @media (prefers-color-scheme: dark) {
        .wc-topbar {
          background: #171716;
          border-color: #31302e;
        }
        .wc-mark {
          color: #f3eee6;
        }
        .wc-sub {
          color: #9a938c;
        }
      }
    </style>
  </head>
  <body>
    <div class="wc-topbar">
      <span class="wc-mark">Ruchoir<span class="wc-dot">.</span></span>
      <span class="wc-sub">API reference</span>
    </div>

    <!--
      Interactive OpenAPI reference (Scalar), served same-origin (strict CSP). It renders
      the live spec at /api/openapi.json. Configuration:
        - withDefaultFonts:false  -> no external font CDN (sovereignty rule)
        - customCss               -> Ruchoir palette (terracotta accent, olive neutrals),
                                     IBM Plex fonts, and hides the "Powered by Scalar" link.
      The standalone bundle is vendored: see public/vendor/README.md.
    -->
    <script
      id="api-reference"
      data-url="/api/openapi.json"
      data-configuration="{&quot;withDefaultFonts&quot;:false,&quot;customCss&quot;:&quot;:root{--scalar-color-accent:#c65d45;--scalar-color-1:#171716;--scalar-color-2:#4b4945;--scalar-color-3:#807a74;--scalar-background-1:#f7f3ed;--scalar-background-2:#f3eee6;--scalar-background-3:#f0e8e0;--scalar-border-color:#e8ded2;--scalar-font:'IBM Plex Sans',system-ui,sans-serif;--scalar-font-code:'IBM Plex Mono',ui-monospace,monospace}.dark-mode{--scalar-color-accent:#d07a66;--scalar-color-1:#f3eee6;--scalar-color-2:#cec5ba;--scalar-color-3:#9a938c;--scalar-background-1:#171716;--scalar-background-2:#31302e;--scalar-background-3:#4b4945;--scalar-border-color:#31302e}a[href*='scalar.com']{display:none!important}&quot;}"
    ></script>
    <script src="/vendor/scalar.standalone.js"></script>
  </body>
</html>
