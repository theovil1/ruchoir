name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Set up Rust
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Build (release)
        run: cargo build --release -p workchat-api

  web:
    name: Web (Next.js static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @workchat/web lint
      - name: Build (static export)
        run: pnpm --filter @workchat/web build

  audit:
    name: Security audit (informational)
    runs-on: ubuntu-latest
    # Day-one advisories in deep transitive deps should not block the whole pipeline.
    # Tighten to required once the dependency tree is triaged during hardening.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup show
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: pnpm audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -r audit
